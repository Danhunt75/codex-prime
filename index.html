<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bienvenue sur Codex Prime. Accédez à votre outil depuis la page d’accueil.">
  <title>Codex Prime — Accueil</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c1020; color: #eef2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(ellipse at top right, #243459 0, transparent 60%); }
    header, main, footer { width: min(100% - 3rem, 1080px); margin-inline: auto; }
    header { padding-block: 2rem; font-size: 1.15rem; font-weight: 750; letter-spacing: .04em; }
    header span { color: #9bb5ff; }
    main { flex: 1; display: grid; align-content: center; padding-block: 5rem; }
    .eyebrow { color: #a9bef9; font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(3rem, 9vw, 6.5rem); line-height: 1.05; letter-spacing: -.055em; margin: 1rem 0 1.5rem; max-width: 850px; }
    .intro { color: #bbc5dd; font-size: 1.15rem; line-height: 1.7; max-width: 540px; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    a { color: inherit; text-decoration: none; }
    .button { display: inline-block; padding: 1rem 1.4rem; border: 1px solid #556385; border-radius: .75rem; font-weight: 650; }
    .primary { background: #c2d1ff; color: #10192f; border-color: #c2d1ff; }
    a:hover { filter: brightness(1.12); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    footer { padding-block: 1.5rem; border-top: 1px solid #303c59; color: #a4b0cc; font-size: .85rem; }
    @media (max-width: 480px) { header, main, footer { width: calc(100% - 2rem); } main { padding-block: 3rem; } .button { width: 100%; text-align: center; } }
  </style>
</head>
<body>
  <header>CODEX <span>PRIME</span></header>
  <main>
    <p class="eyebrow">Votre point de départ</p>
    <h1>Bienvenue sur<br>Codex Prime.</h1>
    <p class="intro">Retrouvez votre outil en un clic et explorez le projet sur GitHub.</p>
    <nav class="actions" aria-label="Liens principaux">
      <a class="button primary" href="outil.html">Ouvrir l’outil →</a>
      <a class="button" href="https://github.com/Danhunt75/codex-prime">Voir le dépôt GitHub</a>
    </nav>
  </main>
  <footer>Codex Prime · Un point d’entrée pour vos outils.</footer>
</body>
</html>
