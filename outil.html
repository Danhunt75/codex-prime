<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page d'outils du projet Codex Prime">
  <title>Outils | Codex Prime</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #25346b, #0b1020 65%); color: #f5f7ff; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); padding: clamp(24px, 5vw, 48px); border: 1px solid #ffffff2a; border-radius: 24px; background: #ffffff0d; box-shadow: 0 18px 60px #0005; }
    .eyebrow { color: #a5b4fc; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 8px 0 12px; }
    p { color: #cbd5e1; line-height: 1.65; }
    .outil { margin-top: 28px; padding: 20px; border: 1px solid #ffffff24; border-radius: 16px; background: #0f172acc; }
    label { display: block; margin-bottom: 10px; font-weight: 600; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    input { flex: 1 1 220px; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid #64748b; background: #111a30; color: white; font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 12px 18px; background: #818cf8; color: #10122b; font: inherit; font-weight: 700; }
    button:hover { background: #a5b4fc; }
    #resultat { min-height: 1.5em; margin-bottom: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Codex Prime</div>
    <h1>Mes outils</h1>
    <p>Bienvenue sur votre espace d'outils. Cette page est une base autonome en HTML, CSS et JavaScript, prête à être personnalisée.</p>
    <section class="outil" aria-labelledby="outil-titre">
      <h2 id="outil-titre">Outil de bienvenue</h2>
      <label for="nom">Votre prénom</label>
      <div class="controls">
        <input id="nom" type="text" maxlength="80" placeholder="Saisissez votre prénom">
        <button id="saluer" type="button">Dire bonjour</button>
      </div>
      <p id="resultat" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const input = document.getElementById('nom');
    const resultat = document.getElementById('resultat');
    function saluer() {
      const nom = input.value.trim();
      resultat.textContent = nom ? `Bonjour, ${nom} ! 👋` : 'Saisissez votre prénom pour commencer.';
    }
    document.getElementById('saluer').addEventListener('click', saluer);
    input.addEventListener('keydown', event => { if (event.key === 'Enter') saluer(); });
  </script>
</body>
</html>
